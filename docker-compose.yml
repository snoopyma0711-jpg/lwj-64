version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipe-workshop-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=recipe-workshop-secret-key-2024
      - DB_PATH=./data/recipes.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipe-workshop-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
